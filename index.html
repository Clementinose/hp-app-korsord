<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HP-Korsord</title>
  <meta name="description" content="Korsord med ord från högskoleprovets ORD-del.">
  <meta name="theme-color" content="#1b1f3b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">HP</span>
      <div>
        <h1>Korsord</h1>
        <p class="subtitle">Träna på ORD-delen</p>
      </div>
    </div>
    <div class="top-right">
      <span class="timer" id="timer" aria-label="Tid">0:00</span>
      <button class="icon-btn" id="btn-stats" aria-label="Statistik" title="Statistik">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="board-wrap">
      <div class="toolbar">
        <div class="segmented" role="radiogroup" aria-label="Svårighetsgrad" id="difficulty">
          <button data-level="easy" role="radio">Lätt</button>
          <button data-level="medium" role="radio">Medel</button>
          <button data-level="hard" role="radio">Svår</button>
        </div>
        <button class="btn primary" id="btn-new">Nytt korsord</button>
      </div>

      <div class="board" id="board" aria-label="Korsord"></div>

      <div class="actions">
        <button class="btn" id="btn-check">Kontrollera</button>
        <button class="btn" id="btn-letter">Visa bokstav</button>
        <button class="btn" id="btn-word">Visa ord</button>
        <button class="btn ghost" id="btn-solve">Ge upp</button>
      </div>
    </section>

    <aside class="clues">
      <div class="clue-col">
        <h2>Vågrätt</h2>
        <ol id="clues-across"></ol>
      </div>
      <div class="clue-col">
        <h2>Lodrätt</h2>
        <ol id="clues-down"></ol>
      </div>
    </aside>
  </main>

  <div class="dock">
    <div class="current-clue" id="current-clue">
      <button class="nav" id="prev-clue" aria-label="Föregående ledtråd">‹</button>
      <div class="cc-text"><span class="cc-num" id="cc-num"></span><span id="cc-clue"></span></div>
      <button class="nav" id="next-clue" aria-label="Nästa ledtråd">›</button>
    </div>
    <div class="keyboard" id="keyboard" aria-label="Tangentbord"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="win-dialog">
    <div class="dialog-body">
      <div class="confetti" aria-hidden="true">🎉</div>
      <h2 id="win-title">Snyggt löst!</h2>
      <p id="win-summary"></p>
      <h3>Orden i korsordet</h3>
      <ul class="glossary" id="win-words"></ul>
      <div class="dialog-actions">
        <button class="btn" id="win-close">Stäng</button>
        <button class="btn primary" id="win-new" autofocus>Nytt korsord</button>
      </div>
    </div>
  </dialog>

  <dialog id="stats-dialog">
    <div class="dialog-body">
      <h2>Statistik</h2>
      <div class="stats-grid" id="stats-grid"></div>
      <div class="dialog-actions">
        <button class="btn primary" id="stats-close" autofocus>Stäng</button>
      </div>
    </div>
  </dialog>

  <dialog id="confirm-dialog">
    <div class="dialog-body">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions">
        <button class="btn" value="cancel" id="confirm-no">Avbryt</button>
        <button class="btn primary" id="confirm-yes">Ja</button>
      </div>
    </div>
  </dialog>

  <script src="js/words.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
